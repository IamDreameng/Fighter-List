    return (name||'?').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2) || '?';
}

function closeModal(id) { el(id).classList.add('hidden'); }
function openModal(id) { el(id).classList.remove('hidden'); }

// ─── DATA ─────────────────────────────────────────────────────
async function loadData() {
    const [gymRes, fightRes, gearRes, sponsorRes, profileRes] = await Promise.all([
        sb.from('gyms').select('*'),
        sb.from('fights').select('*').order('event_date', {ascending:true}),
        sb.from('gear_discounts').select('*'),
        sb.from('sponsors').select('*'),
        sb.from('profiles').select('*')
    ]);
    if(gymRes.data) gyms = gymRes.data.sort((a,b) => {
        const aF = a.name?.toLowerCase().includes('bangtao');
        const bF = b.name?.toLowerCase().includes('bangtao');
        if(aF && !bF) return -1; if(!aF && bF) return 1;
        return (b.upvotes||0)-(a.upvotes||0);
    });
    if(fightRes.data) fights = fightRes.data;
    if(gearRes.data) gear = gearRes.data.sort((a,b) => {
        const aR = a.brand_name?.toLowerCase().includes('rest round');
        const bR = b.brand_name?.toLowerCase().includes('rest round');
        if(aR && !bR) return -1; if(!aR && bR) return 1; return 0;
    });
    if(sponsorRes.data) sponsors = sponsorRes.data;
    if(profileRes.data) profiles = profileRes.data;
    updateCityFilter();
    el('loading-screen').style.display = 'none';
    renderView();
}

function updateCityFilter() {
    const sel = el('city-filter');
    const locs = [...new Set([
        ...gyms.map(g=>g.city_country||g.city).filter(Boolean),
        ...profiles.map(p=>p.city).filter(Boolean)
    ])].sort();
    sel.innerHTML = '<option value="All">All Cities</option>' + locs.map(c=>`<option>${c}</option>`).join('');
}

// ─── NAV ──────────────────────────────────────────────────────
function changeView(v) {
    currentView = v;
    el('search-input').value = '';
    el('city-filter').value = 'All';
    el('type-filter').value = 'All';
    ['gyms','fighters','fights','deals'].forEach(t => {
        const btn = el('tab-'+t);
        btn.className = 'tab-btn ' + (t===v ? 'tab-active' : 'tab-inactive');
    });
    const needsFilters = ['gyms','fighters','fights'].includes(v);
    el('filters').style.display = needsFilters ? 'flex' : 'none';
    renderView();
}

}

    const c = el('auth-form-container');
    c.innerHTML = `

            <div><p style="font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;margin:0 0 6px;">Email</p><input id="auth-email" type="email" placeholder="athlete@fighterlist.com" class="input-field"></div>
            <div><p style="font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;margin:0 0 6px;">Password</p><input id="auth-password" type="password" placeholder="••••••••" class="input-field"></div>
            ${!authIsLogin?`<div><p style="font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;margin:0 0 6px;">Confirm Password</p><input id="auth-confirm" type="password" placeholder="••••••••" class="input-field"></div>`:''}
            <p id="auth-error" style="font-size:10px;font-weight:900;text-transform:uppercase;color:#ef4444;letter-spacing:.05em;margin:0;display:none;"></p>
            <button onclick="submitAuth()" class="btn btn-dark" style="width:100%;padding:18px;border-radius:.75rem;font-size:11px;">${authIsLogin?'Enter →':'Create Profile →'}</button>
            <p style="text-align:center;font-size:9px;font-weight:900;text-transform:uppercase;color:#9ca3af;cursor:pointer;margin:0;" onclick="authIsLogin=!authIsLogin;renderAuthForm();">${authIsLogin?'No account? Sign up free →':'Already a member? Login →'}</p>
        </div>`;
}

async function submitAuth() {
    const email = el('auth-email')?.value;
    const password = el('auth-password')?.value;
    const errEl = el('auth-error');
    errEl.style.display='none';

    if(authIsLogin) {
        const {error} = await sb.auth.signInWithPassword({email, password});
        if(error) { errEl.textContent=error.message; errEl.style.display='block'; }
        else { closeModal('auth-modal'); }
    } else {
        const fullName = el('auth-name')?.value;
        const confirm = el('auth-confirm')?.value;
        if(password!==confirm) { errEl.textContent='Passwords do not match.'; errEl.style.display='block'; return; }
        const {data, error} = await sb.auth.signUp({email, password, options:{data:{full_name:fullName}}});
        if(error) { errEl.textContent=error.message; errEl.style.display='block'; }
        else {
            if(data.user) await sb.from('profiles').insert([{id:data.user.id, full_name:fullName||'Athlete', username:email.split('@')[0], home_gym:'Not Set'}]);
            errEl.textContent='Check your email to confirm your account.';
            errEl.style.cssText='font-size:10px;font-weight:900;text-transform:uppercase;color:#16a34a;letter-spacing:.05em;';
            errEl.style.display='block';
            authIsLogin=true; renderAuthForm();
        }
    }
}
