<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter List | Powered by REST ROUND™</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22black%22/><text x=%2250%%22 y=%2245%%22 text-anchor=%22middle%22 fill=%22%23d7df22%22 font-family=%22Arial Black, sans-serif%22 font-size=%2218%22 font-weight=%22900%22 style=%22letter-spacing:-1px%22>FIGHTER</text><text x=%2250%%22 y=%2282%%22 text-anchor=%22middle%22 fill=%22%23d7df22%22 font-family=%22Arial Black, sans-serif%22 font-size=%2236%22 font-weight=%22900%22 style=%22letter-spacing:-1px%22>LIST</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .selection-brand::selection { background: #d7df22; color: black; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.35s ease-out; }
        .animate-modal { animation: slideIn 0.3s ease-out; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .tab-active { background: black; color: #d7df22; }
        .tab-inactive { color: #9ca3af; }
        .tab-inactive:hover { color: black; }
    </style>
</head>
<body class="bg-white text-black selection-brand overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = "https://eahymntxxgflqkogdfxs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhaHltbnR4eGdmbHFrb2dkZnhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NTYzODEsImV4cCI6MjA5MTEzMjM4MX0.Tg4VEgCcWHtcZYyrXcMILd3jsf8jFDM9twPL-yX8R_s";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- ICONS ---
        const InstagramIcon = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        );
        const WhatsAppIcon = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        );
        const XIcon = ({ size = 14 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
        );

        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
        };

        const CopyButton = ({ text, size = 12, showText = false }) => {
            const [copied, setCopied] = useState(false);
            const handleCopy = (e) => {
                e.stopPropagation();
                navigator.clipboard?.writeText(text).catch(() => {
                    const ta = document.createElement("textarea");
                    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                });
                setCopied(true); setTimeout(() => setCopied(false), 2000);
            };
            return (
                <button onClick={handleCopy} className={`flex items-center gap-1.5 px-2 py-1 rounded-lg transition-all active:scale-95 ${copied ? 'bg-green-50' : 'hover:bg-gray-100'}`}>
                    {showText && <span className={`text-[8px] font-black uppercase ${copied ? 'text-green-600' : 'text-gray-400'}`}>{copied ? 'Copied!' : 'Copy'}</span>}
                    <Icon name={copied ? "check" : "copy"} size={size} className={copied ? "text-green-500" : "text-gray-400"} />
                </button>
            );
        };

        const MetricBar = ({ label, value, icon }) => (
            <div className="space-y-1.5">
                <div className="flex justify-between items-center font-black uppercase tracking-widest text-gray-500 text-[9px]">
                    <div className="flex items-center gap-1.5"><Icon name={icon} size={11} />{label}</div>
                    <span className="text-black font-black">{value || 0}%</span>
                </div>
                <div className="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-black transition-all duration-700" style={{ width: `${value || 0}%` }} />
                </div>
            </div>
        );

        // Discipline pill
        const Pill = ({ label, accent = false }) => (
            <span className={`px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-widest ${accent ? 'bg-[#d7df22] text-black' : 'bg-gray-100 text-gray-500'}`}>{label}</span>
        );

        // Inline RestRound ad card — shown once per grid at position 4
        const AdCard = () => (
            <a href="https://restround.co" target="_blank" className="bg-black rounded-[2.5rem] p-8 flex flex-col justify-between text-left border border-[#d7df22]/20 shadow-2xl relative overflow-hidden group h-full">
                <div className="absolute top-[-20%] right-[-10%] w-64 h-64 bg-[#d7df22] opacity-10 rounded-full blur-3xl group-hover:opacity-20 transition-opacity pointer-events-none"></div>
                <div>
                    <span className="bg-[#d7df22] text-black text-[8px] font-black px-2 py-0.5 rounded uppercase tracking-widest mb-4 inline-block italic">Partner</span>
                    <h4 className="text-2xl font-black italic uppercase text-white leading-none mb-2 tracking-tighter">REST ROUND™</h4>
                    <p className="text-[#d7df22] text-[9px] font-black uppercase tracking-[0.2em] mb-4 italic">HOCL Combat Hygiene</p>
                    <p className="text-gray-400 text-[11px] leading-relaxed">Stop staph and ringworm before they stop your camp. Engineered for combat athletes.</p>
                </div>
                <div className="w-full bg-[#d7df22] text-black py-3 rounded-xl font-black uppercase text-[9px] tracking-[0.2em] text-center mt-6 group-hover:bg-white transition-colors">Shop Rest Round™</div>
            </a>
        );

        // Lock gate for non-users
        const RegisterCTA = ({ title, text, onSignUp }) => (
            <div onClick={onSignUp} className="bg-gray-50 border-2 border-dashed border-gray-200 p-8 rounded-[2.5rem] flex flex-col items-center justify-center text-center cursor-pointer hover:border-black transition-all group">
                <Icon name="lock" size={28} className="text-black mb-4 group-hover:scale-110 transition-transform"/>
                <h4 className="text-lg font-black italic uppercase text-black leading-none mb-2 tracking-tighter">{title}</h4>
                <p className="text-[10px] font-bold uppercase text-gray-400 tracking-widest mb-6">{text}</p>
                <button className="bg-black text-[#d7df22] px-8 py-3 rounded-full text-[9px] font-black uppercase italic">Sign Up Free</button>
            </div>
        );

        // Avatar stack for gym cards
        const AvatarStack = ({ gymId, profiles }) => {
            const attendees = profiles.filter(p => p.current_gym_id == gymId).slice(0, 3);
            if (attendees.length === 0) return <span className="text-xs text-gray-300 font-black">—</span>;
            return (
                <div className="flex -space-x-2">
                    {attendees.map((p, i) => (
                        <img key={i} src={p.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(p.full_name)} className="inline-block h-7 w-7 rounded-full ring-2 ring-white object-cover" alt={p.full_name} />
                    ))}
                </div>
            );
        };

        // ============================================================
        // MAIN APP
        // ============================================================
        const App = () => {
            const [view, setView] = useState("gyms");
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            // Data
            const [gyms, setGyms] = useState([]);
            const [fights, setFights] = useState([]);
            const [gear, setGear] = useState([]);
            const [sponsors, setSponsors] = useState([]);
            const [profiles, setProfiles] = useState([]);

            // UI state
            const [searchQuery, setSearchQuery] = useState("");
            const [activeCity, setActiveCity] = useState("All");
            const [activeType, setActiveType] = useState("All");
            const [selectedGym, setSelectedGym] = useState(null);
            const [selectedFighter, setSelectedFighter] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showProfilePanel, setShowProfilePanel] = useState(false);
            const [revealedSponsors, setRevealedSponsors] = useState(new Set());
            const [revealedFights, setRevealedFights] = useState(new Set());
            const [copiedShareId, setCopiedShareId] = useState(null);
            const [dealsTab, setDealsTab] = useState("gear"); // "gear" | "sponsors"
            const [fightsTab, setFightsTab] = useState("matchmaking"); // "matchmaking" | "events"

            // Auth form
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [confirmPassword, setConfirmPassword] = useState("");
            const [fullName, setFullName] = useState("");
            const [authError, setAuthError] = useState("");
            const [isLogin, setIsLogin] = useState(true);

            // Profile editing
            const [isEditingProfile, setIsEditingProfile] = useState(false);
            const [editFields, setEditFields] = useState({});

            const sortGyms = (data) => [...data].sort((a, b) => {
                const aFeat = a.name?.toLowerCase().includes("bangtao");
                const bFeat = b.name?.toLowerCase().includes("bangtao");
                if (aFeat && !bFeat) return -1;
                if (!aFeat && bFeat) return 1;
                return (b.upvotes || 0) - (a.upvotes || 0);
            });

            const sortGear = (data) => [...data].sort((a, b) => {
                const aRR = a.brand_name?.toLowerCase().includes("rest round");
                const bRR = b.brand_name?.toLowerCase().includes("rest round");
                if (aRR && !bRR) return -1;
                if (!aRR && bRR) return 1;
                return 0;
            });

            const loadData = async () => {
                setLoading(true);
                const [gymRes, fightRes, gearRes, sponsorRes, profileRes] = await Promise.all([
                    supabase.from('gyms').select('*'),
                    supabase.from('fights').select('*').order('event_date', { ascending: true }),
                    supabase.from('gear_discounts').select('*'),
                    supabase.from('sponsors').select('*'),
                    supabase.from('profiles').select('*')
                ]);
                if (gymRes.data) setGyms(sortGyms(gymRes.data));
                if (fightRes.data) setFights(fightRes.data);
                if (gearRes.data) setGear(sortGear(gearRes.data));
                if (sponsorRes.data) setSponsors(sponsorRes.data);
                if (profileRes.data) setProfiles(profileRes.data);
                setLoading(false);
            };

            useEffect(() => {
                loadData();
                supabase.auth.getSession().then(({ data: { session } }) => setUser(session?.user ?? null));
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => setUser(session?.user ?? null));
                return () => subscription.unsubscribe();
            }, []);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError("");
                if (isLogin) {
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) setAuthError(error.message);
                    else { setShowAuthModal(false); setShowProfilePanel(true); }
                } else {
                    if (password !== confirmPassword) { setAuthError("Passwords do not match."); return; }
                    const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
                    if (error) setAuthError(error.message);
                    else {
                        if (data.user) {
                            await supabase.from('profiles').insert([{ id: data.user.id, full_name: fullName || "Athlete", username: email.split('@')[0], home_gym: "Not Set" }]);
                        }
                        setAuthError("Check your email to confirm your account.");
                        setIsLogin(true);
                    }
                }
            };

            const myProfile = profiles.find(p => p.id === user?.id) || {};

            const handleUpdateProfile = async () => {
                if (!user) return;
                const { error } = await supabase.from('profiles').update(editFields).eq('id', user.id);
                if (!error) { await loadData(); setIsEditingProfile(false); }
            };

            const handleShareFight = (f) => {
                const url = `${window.location.origin}${window.location.pathname}?view=fights&id=${f.id}`;
                navigator.clipboard?.writeText(url).catch(() => {
                    const ta = document.createElement("textarea");
                    ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                });
                setCopiedShareId(f.id); setTimeout(() => setCopiedShareId(null), 2000);
            };

            const dynamicCities = useMemo(() => {
                const locs = [
                    ...gyms.map(g => g.city_country || g.city).filter(Boolean),
                    ...profiles.map(p => p.city).filter(Boolean)
                ];
                return [...new Set(locs)].sort();
            }, [gyms, profiles]);

            // ---- FILTERED DATA ----
            const filteredGyms = gyms.filter(g => {
                const loc = `${g.city} ${g.location} ${g.city_country}`.toLowerCase();
                const matchCity = activeCity === "All" || loc.includes(activeCity.toLowerCase());
                const matchType = activeType === "All" || g.disciplines?.toLowerCase().includes(activeType.toLowerCase());
                return matchCity && matchType && g.name?.toLowerCase().includes(searchQuery.toLowerCase());
            });

            const filteredFighters = profiles.filter(p => {
                const matchCity = activeCity === "All" || (p.city || "").toLowerCase().includes(activeCity.toLowerCase());
                const matchType = activeType === "All" || (p.disciplines || "").toLowerCase().includes(activeType.toLowerCase());
                const matchSearch = (p.full_name || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                    (p.username || "").toLowerCase().includes(searchQuery.toLowerCase());
                return matchCity && matchType && matchSearch;
            });

            const filteredFights = fights.filter(f => {
                const loc = `${f.city} ${f.location}`.toLowerCase();
                const matchCity = activeCity === "All" || loc.includes(activeCity.toLowerCase());
                const matchType = activeType === "All" || f.fight_type?.toLowerCase().includes(activeType.toLowerCase());
                return matchCity && matchType && f.event_name?.toLowerCase().includes(searchQuery.toLowerCase());
            });

            const filteredGear = gear.filter(item =>
                item.brand_name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                item.product_name?.toLowerCase().includes(searchQuery.toLowerCase())
            );
            const filteredSponsors = sponsors.filter(s =>
                s.brand_name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                s.focus?.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // ---- NAV TABS ----
            const TABS = [
                { id: 'gyms', label: 'Gyms', icon: 'map-pin' },
                { id: 'fighters', label: 'Fighters', icon: 'users' },
                { id: 'fights', label: 'Fights', icon: 'swords' },
                { id: 'deals', label: 'Deals', icon: 'tag' },
            ];

            const needsFilters = ['gyms', 'fighters', 'fights'].includes(view);

            const changeView = (v) => {
                setView(v); setSearchQuery(""); setActiveCity("All"); setActiveType("All");
                setShowProfilePanel(false); setSelectedGym(null); setSelectedFighter(null);
            };

            // =========================================================
            // RENDER
            // =========================================================
            return (
                <div className="min-h-screen bg-white text-black selection-brand font-['Montserrat'] overflow-x-hidden">

                    {/* ── NAV ─────────────────────────────────────── */}
                    <nav className="sticky top-0 z-[100] bg-white border-b border-gray-100 h-16 flex items-center justify-between px-4 md:px-12 shadow-sm">
                        {/* Logo */}
                        <button className="flex items-center gap-3 group shrink-0" onClick={() => changeView('gyms')}>
                            <div className="w-10 h-10 bg-black rounded-xl flex items-center justify-center shadow-lg border-2 border-transparent group-hover:border-[#d7df22] transition-all overflow-hidden">
                                <svg viewBox="0 0 100 100" className="w-full h-full p-1.5">
                                    <text x="50%" y="45%" textAnchor="middle" fill="#d7df22" fontFamily="Arial Black, sans-serif" fontSize="18" fontWeight="900" style={{letterSpacing:'-1.5px'}}>FIGHTER</text>
                                    <text x="50%" y="82%" textAnchor="middle" fill="#d7df22" fontFamily="Arial Black, sans-serif" fontSize="36" fontWeight="900" style={{letterSpacing:'-1.5px'}}>LIST</text>
                                </svg>
                            </div>
                            <span className="text-xl font-black italic uppercase tracking-tighter leading-none hidden sm:block">FIGHTER LIST</span>
                        </button>

                        {/* Tabs */}
                        <div className="flex gap-0.5 bg-gray-50 p-1 rounded-full shadow-inner border border-gray-100">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => changeView(tab.id)}
                                    className={`flex items-center gap-1.5 px-3 sm:px-4 py-2 rounded-full text-[9px] sm:text-[10px] font-black uppercase transition-all ${view === tab.id && !showProfilePanel ? 'bg-black text-[#d7df22] shadow-md' : 'text-gray-400 hover:text-black'}`}>
                                    <Icon name={tab.icon} size={13} />
                                    <span className="hidden md:inline">{tab.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* User button */}
                        <button onClick={() => user ? setShowProfilePanel(!showProfilePanel) : setShowAuthModal(true)}
                            className={`p-2.5 rounded-full shadow-md transition-all active:scale-90 shrink-0 ${showProfilePanel ? 'bg-[#d7df22] text-black' : 'bg-black text-[#d7df22]'}`}>
                            <Icon name="user" size={20} />
                        </button>
                    </nav>

                    {/* ── SEARCH & FILTERS ────────────────────────── */}
                    {!showProfilePanel && needsFilters && (
                        <div className="w-full px-4 md:px-12 pt-5 pb-3 flex flex-col sm:flex-row gap-3 items-center max-w-[1400px] mx-auto animate-fade-in">
                            <div className="flex gap-2 w-full sm:w-auto">
                                <div className="relative flex-1 sm:w-44">
                                    <Icon name="map-pin" size={13} className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" />
                                    <select value={activeCity} onChange={e => setActiveCity(e.target.value)}
                                        className="w-full bg-gray-50 border-2 border-transparent hover:border-black p-3.5 pl-9 pr-6 rounded-full font-black uppercase text-[9px] tracking-widest outline-none cursor-pointer transition-all">
                                        <option value="All">All Cities</option>
                                        {dynamicCities.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div className="relative flex-1 sm:w-40">
                                    <Icon name="swords" size={13} className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" />
                                    <select value={activeType} onChange={e => setActiveType(e.target.value)}
                                        className="w-full bg-gray-50 border-2 border-transparent hover:border-black p-3.5 pl-9 pr-6 rounded-full font-black uppercase text-[9px] tracking-widest outline-none cursor-pointer transition-all">
                                        <option value="All">All Styles</option>
                                        <option>MMA</option><option>Muay Thai</option><option>BJJ</option><option>Boxing</option><option>Wrestling</option>
                                    </select>
                                </div>
                            </div>
                            <div className="relative flex-1 w-full">
                                <Icon name="search" size={17} className="absolute left-5 top-1/2 -translate-y-1/2 text-gray-300" />
                                <input type="text" placeholder={`Search ${view}...`} value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full bg-gray-50 border-2 border-transparent focus:border-black focus:bg-white p-3.5 pl-12 rounded-full font-bold outline-none transition-all" />
                            </div>
                        </div>
                    )}

                    {/* ── MAIN ────────────────────────────────────── */}
                    <main className="w-full px-4 md:px-12 py-6 min-h-[60vh] max-w-[1400px] mx-auto">
                        {loading ? (
                            <div className="py-32 text-center text-gray-300 font-black uppercase tracking-[0.4em] text-sm animate-pulse italic">Loading Intelligence…</div>
                        ) : showProfilePanel && user ? (
                            // ── PROFILE PANEL ─────────────────────
                            <ProfilePanel
                                myProfile={myProfile}
                                user={user}
                                gyms={gyms}
                                isEditing={isEditingProfile}
                                editFields={editFields}
                                setEditFields={setEditFields}
                                onEdit={() => { setEditFields({...myProfile}); setIsEditingProfile(true); }}
                                onSave={handleUpdateProfile}
                                onCancel={() => setIsEditingProfile(false)}
                                onSignOut={() => { supabase.auth.signOut(); setShowProfilePanel(false); }}
                            />
                        ) : (
                            <div className="animate-fade-in">

                                {/* ── GYMS ── */}
                                {view === 'gyms' && (
                                    <GymsView
                                        gyms={filteredGyms}
                                        profiles={profiles}
                                        user={user}
                                        onSignUp={() => setShowAuthModal(true)}
                                        onSelect={setSelectedGym}
                                    />
                                )}

                                {/* ── FIGHTERS ── */}
                                {view === 'fighters' && (
                                    <FightersView
                                        fighters={filteredFighters}
                                        user={user}
                                        onSignUp={() => setShowAuthModal(true)}
                                        onSelect={setSelectedFighter}
                                    />
                                )}

                                {/* ── FIGHTS ── */}
                                {view === 'fights' && (
                                    <FightsView
                                        fights={filteredFights}
                                        user={user}
                                        onSignUp={() => setShowAuthModal(true)}
                                        fightsTab={fightsTab}
                                        setFightsTab={setFightsTab}
                                        revealedFights={revealedFights}
                                        setRevealedFights={setRevealedFights}
                                        copiedShareId={copiedShareId}
                                        onShare={handleShareFight}
                                    />
                                )}

                                {/* ── DEALS ── */}

                                                <div className="flex items-center gap-2 bg-black text-white p-3 rounded-xl animate-fade-in">
                                                    <span className="text-[9px] font-black italic flex-1 truncate">{s.email || 'team.restround@gmail.com'}</span>
                                                    <CopyButton text={s.email || 'team.restround@gmail.com'} size={11} showText />
                                                    <button onClick={() => toggleSponsor(s.id)} className="text-white/30 hover:text-red-400"><Icon name="x" size={12}/></button>
                                                </div>
                                            )}
                                        </div>
                                    );
                                    return els;
                                })}
                                {!user && sponsors.length > 5 && <RegisterCTA title="Unlock Sponsors" text="Connect with brands looking for fighters" onSignUp={onSignUp} />}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // GYM MODAL
        // ============================================================
        const GymModal = ({ gym, profiles, onClose }) => (
            <div className="fixed inset-0 z-[400] flex items-end md:items-center justify-center p-0 md:p-8">
                <div className="absolute inset-0 bg-black/80 backdrop-blur-sm animate-fade-in" onClick={onClose} />
                <div className="relative bg-white w-full max-w-4xl h-[92vh] md:h-auto md:max-h-[88vh] rounded-t-[3rem] md:rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col md:flex-row animate-modal">
                    <button onClick={onClose} className="absolute top-5 right-5 bg-black text-[#d7df22] p-2 rounded-full z-10 hover:scale-110 transition-transform">
                        <Icon name="x" size={18} />
                    </button>
                    <div className="md:w-2/5 relative h-56 md:h-auto shrink-0 bg-gray-100 overflow-hidden">
                        <img src={gym.image_url || "https://images.unsplash.com/photo-1595079676339-1534801ad6cf?auto=format&fit=crop&q=80&w=600"} className="w-full h-full object-cover" alt={gym.name} />
                    </div>
                    <div className="md:w-3/5 p-8 md:p-10 overflow-y-auto no-scrollbar space-y-8 text-left">
                        <div>
                            <div className="flex items-center gap-1.5 text-gray-400 font-bold uppercase text-[9px] tracking-widest mb-2 italic">
                                <Icon name="map-pin" size={12} className="text-red-500"/>{gym.city_country || gym.city || gym.location}
                            </div>
                            <h2 className="text-2xl font-black italic uppercase tracking-tighter leading-none">{gym.name}</h2>
                        </div>

                        {/* Who's here */}
                        <div className="bg-gray-50 p-6 rounded-2xl grid grid-cols-3 gap-1 text-center border border-gray-100">
                            <div className="space-y-2">
                                <p className="text-[8px] font-black text-gray-400 uppercase italic">Here Now</p>
                                <AvatarStack gymId={gym.id} profiles={profiles} />
                            </div>
                            <div className="space-y-2 border-x border-gray-200">
                                <p className="text-[8px] font-black text-gray-400 uppercase italic">Visit Soon</p>
                                <span className="text-xl font-black">—</span>
                            </div>
                            <div className="space-y-2">
                                <p className="text-[8px] font-black text-gray-400 uppercase italic">Was Here</p>
                                <span className="text-xl font-black">—</span>
                            </div>
                        </div>

                        {/* Metrics */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <MetricBar label="Hygiene" value={gym.hygiene_score} icon="shield-check" />
                            <MetricBar label="Food Safety" value={gym.food_safety} icon="utensils" />
                            <MetricBar label="English" value={gym.english_score} icon="languages" />
                            <MetricBar label="Safe for Women" value={gym.safe_for_women} icon="shield" />
                        </div>

                        <a href={gym.website} target="_blank"
                            className="block w-full bg-black text-[#d7df22] py-4 rounded-xl font-black uppercase italic tracking-[0.2em] text-[10px] text-center hover:bg-[#d7df22] hover:text-black transition-colors shadow-lg">
                            Visit Gym Website →
                        </a>
                    </div>
                </div>
            </div>
        );

        // ============================================================
        // FIGHTER MODAL
        // ============================================================
        const FighterModal = ({ fighter, gyms, onClose }) => {
            const homeGym = gyms.find(g => g.name === fighter.home_gym);
            const getInitials = (name) => name?.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2) || '?';

            return (
                <div className="fixed inset-0 z-[400] flex items-end md:items-center justify-center p-0 md:p-8">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm animate-fade-in" onClick={onClose} />
                    <div className="relative bg-white w-full max-w-lg rounded-t-[3rem] md:rounded-[2.5rem] overflow-hidden shadow-2xl animate-modal">
                        <button onClick={onClose} className="absolute top-5 right-5 bg-black text-[#d7df22] p-2 rounded-full z-10 hover:scale-110 transition-transform">
                            <Icon name="x" size={18} />
                        </button>
                        {/* Header */}
                        <div className="bg-black p-10 text-center">
                            {fighter.avatar_url ? (
                                <img src={fighter.avatar_url} className="w-28 h-28 rounded-full border-4 border-[#d7df22] mx-auto mb-5 object-cover" alt={fighter.full_name} />
                            ) : (
                                <div className="w-28 h-28 rounded-full border-4 border-[#d7df22] mx-auto mb-5 bg-gray-900 flex items-center justify-center">
                                    <span className="text-[#d7df22] text-3xl font-black italic">{getInitials(fighter.full_name)}</span>
                                </div>
                            )}
                            <h2 className="text-2xl font-black italic uppercase text-white tracking-tighter leading-none">{fighter.full_name}</h2>
                            {fighter.username && (
                                <a href={`https://instagram.com/${fighter.username}`} target="_blank"
                                    className="inline-flex items-center gap-2 mt-3 text-[#d7df22] text-[9px] font-black uppercase tracking-[0.3em] bg-white/10 px-4 py-2 rounded-full hover:bg-[#d7df22] hover:text-black transition-all">
                                    <InstagramIcon size={12} /> @{fighter.username}
                                </a>
                            )}
                        </div>
                        {/* Body */}
                        <div className="p-8 space-y-6 text-left overflow-y-auto no-scrollbar max-h-[50vh]">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-gray-50 p-4 rounded-xl">
                                    <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Location</p>
                                    <p className="font-black italic uppercase text-sm">{fighter.city || '—'}</p>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-xl">
                                    <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Weight Class</p>
                                    <p className="font-black italic uppercase text-sm">{fighter.weight_class || '—'}</p>
                                </div>
                            </div>
                            <div className="bg-gray-50 p-4 rounded-xl">
                                <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-2">Disciplines</p>
                                <div className="flex flex-wrap gap-1">
                                    {(fighter.disciplines || '').split(',').map(d => d.trim()).filter(Boolean).map(d => (
                                        <span key={d} className="bg-black text-[#d7df22] text-[7px] font-black px-3 py-1 rounded-full uppercase tracking-widest">{d}</span>
                                    ))}
                                </div>
                            </div>
                            {fighter.open_to && (
                                <div className="bg-[#d7df22]/10 border border-[#d7df22]/30 p-4 rounded-xl">
                                    <p className="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-2">Open To</p>
                                    <div className="flex flex-wrap gap-1">
                                        {fighter.open_to.split(',').map(o => o.trim()).filter(Boolean).map(o => (
                                            <span key={o} className="bg-[#d7df22] text-black text-[7px] font-black px-3 py-1 rounded-full uppercase tracking-widest">{o}</span>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {fighter.home_gym && (
                                <div className="bg-gray-50 p-4 rounded-xl">
                                    <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Home Gym</p>
                                    <p className="font-black italic uppercase text-sm">{fighter.home_gym}</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // PROFILE PANEL
        // ============================================================
        const ProfilePanel = ({ myProfile, user, gyms, isEditing, editFields, setEditFields, onEdit, onSave, onCancel, onSignOut }) => {
            const getInitials = (name) => name?.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2) || '?';
            const field = (key, label, placeholder, type = "text") => (
                <div>
                    <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1.5 ml-1">{label}</p>
                    <input type={type} value={editFields[key] || ''} onChange={e => setEditFields({...editFields, [key]: e.target.value})}
                        placeholder={placeholder} className="w-full bg-gray-50 border-2 border-transparent focus:border-black p-3.5 rounded-xl font-bold outline-none transition-all text-sm" />
                </div>
            );

            return (
                <div className="max-w-xl mx-auto animate-slide-up">
                    <div className="bg-white rounded-[2.5rem] overflow-hidden shadow-2xl border border-gray-100">
                        {/* Header */}
                        <div className="bg-black p-10 text-center relative">
                            <button onClick={onSignOut} className="absolute top-5 right-5 text-gray-500 hover:text-[#d7df22] transition-colors">
                                <Icon name="log-out" size={18} />
                            </button>
                            {myProfile.avatar_url ? (
                                <img src={myProfile.avatar_url} className="w-24 h-24 rounded-full border-4 border-[#d7df22] mx-auto mb-5 object-cover" alt={myProfile.full_name} />
                            ) : (
                                <div className="w-24 h-24 rounded-full border-4 border-[#d7df22] mx-auto mb-5 bg-gray-900 flex items-center justify-center">
                                    <span className="text-[#d7df22] text-2xl font-black italic">{getInitials(myProfile.full_name)}</span>
                                </div>
                            )}
                            <h2 className="text-2xl font-black italic uppercase text-white tracking-tighter">{myProfile.full_name || 'Athlete'}</h2>
                            {myProfile.username && (
                                <a href={`https://instagram.com/${myProfile.username}`} target="_blank"
                                    className="inline-flex items-center gap-2 mt-2 text-[#d7df22] text-[9px] font-black uppercase tracking-widest bg-white/10 px-4 py-1.5 rounded-full hover:bg-[#d7df22] hover:text-black transition-all">
                                    <InstagramIcon size={11} /> @{myProfile.username}
                                </a>
                            )}
                        </div>
                        {/* Body */}
                        <div className="p-8 space-y-5">
                            {isEditing ? (
                                <>
                                    {field('full_name', 'Full Name', 'Your name')}
                                    {field('username', 'Instagram Handle', '@yourhandle')}
                                    {field('city', 'City / Location', 'Phuket, Thailand')}
                                    {field('weight_class', 'Weight Class', 'Featherweight')}
                                    {field('disciplines', 'Disciplines', 'MMA, Muay Thai, BJJ (comma separated)')}
                                    {field('open_to', 'Open To', 'Sparring, Fights, Sponsors')}
                                    {field('home_gym', 'Home Gym', 'Bangtao MMA')}
                                    {field('current_gym', 'Here Now (gym)', 'Tiger Muay Thai')}
                                    {field('planned_gyms', 'Visiting Soon', 'AKA Thailand')}
                                    <div className="flex gap-3 pt-2">
                                        <button onClick={onSave} className="flex-1 bg-black text-[#d7df22] py-4 rounded-xl font-black uppercase italic tracking-widest text-[9px] hover:bg-[#d7df22] hover:text-black transition-colors shadow-md">Save Profile</button>
                                        <button onClick={onCancel} className="px-6 bg-gray-100 text-gray-500 rounded-xl font-black uppercase text-[9px]">Cancel</button>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-gray-50 p-4 rounded-xl">
                                            <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Location</p>
                                            <p className="font-black italic uppercase text-sm">{myProfile.city || '—'}</p>
                                        </div>
                                        <div className="bg-gray-50 p-4 rounded-xl">
                                            <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Weight Class</p>
                                            <p className="font-black italic uppercase text-sm">{myProfile.weight_class || '—'}</p>
                                        </div>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-xl">
                                        <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-2">Disciplines</p>
                                        <div className="flex flex-wrap gap-1.5">
                                            {(myProfile.disciplines || '').split(',').filter(Boolean).map(d => (
                                                <span key={d} className="bg-black text-[#d7df22] text-[7px] font-black px-3 py-1 rounded-full uppercase tracking-widest">{d.trim()}</span>
                                            ))}
                                            {!myProfile.disciplines && <span className="text-gray-400 text-xs">Not set</span>}
                                        </div>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-xl">
                                        <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Home Gym</p>
                                        <p className="font-black italic uppercase text-sm">{myProfile.home_gym || '—'}</p>
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-xl">
                                        <p className="text-[8px] font-black text-gray-400 uppercase tracking-widest mb-1">Here Now</p>
                                        <p className="font-black italic uppercase text-sm">{myProfile.current_gym || '—'}</p>
                                    </div>
                                    {myProfile.open_to && (
                                        <div className="bg-[#d7df22]/10 border border-[#d7df22]/30 p-4 rounded-xl">
                                            <p className="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-2">Open To</p>
                                            <div className="flex flex-wrap gap-1.5">
                                                {myProfile.open_to.split(',').map(o => o.trim()).filter(Boolean).map(o => (
                                                    <span key={o} className="bg-[#d7df22] text-black text-[7px] font-black px-3 py-1 rounded-full uppercase">{o}</span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={onEdit} className="w-full bg-black text-white py-4 rounded-xl font-black uppercase italic text-[9px] tracking-widest flex items-center justify-center gap-2 hover:text-[#d7df22] transition-colors shadow-md">
                                        <Icon name="settings" size={15} /> Edit My Profile
                                    </button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // AUTH MODAL
        // ============================================================
        const AuthModal = ({ isLogin, setIsLogin, email, setEmail, password, setPassword, confirmPassword, setConfirmPassword, fullName, setFullName, authError, setAuthError, onSubmit, onClose }) => (
            <div className="fixed inset-0 z-[500] flex items-end sm:items-center justify-center p-0 sm:p-8">
                <div className="absolute inset-0 bg-black/70 backdrop-blur-sm animate-fade-in" onClick={onClose} />
                <div className="relative bg-white w-full max-w-md rounded-t-[3rem] sm:rounded-[2.5rem] shadow-2xl overflow-hidden animate-modal">
                    <button onClick={onClose} className="absolute top-5 right-5 bg-gray-100 text-gray-500 p-2 rounded-full hover:bg-black hover:text-[#d7df22] transition-all">
                        <Icon name="x" size={16} />
                    </button>
                    <div className="p-10">
                        <h2 className="text-3xl font-black italic uppercase mb-1 tracking-tighter text-black">{isLogin ? 'Login' : 'Join Fighter List'}</h2>
                        <p className="text-[9px] font-black uppercase text-gray-400 tracking-[0.3em] mb-8">{isLogin ? 'Access your fighter profile' : 'Create your fighter profile free'}</p>
                        <form onSubmit={onSubmit} className="space-y-4">
                            {!isLogin && (
                                <div>
                                    <p className="text-[8px] font-black text-gray-400 uppercase mb-1.5 ml-1 tracking-widest">Full Name</p>
                                    <input type="text" placeholder="Alex Volkanovski" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full bg-gray-50 p-4 rounded-xl font-bold outline-none border-2 border-transparent focus:border-black transition-all" required />
                                </div>
                            )}
                            <div>
                                <p className="text-[8px] font-black text-gray-400 uppercase mb-1.5 ml-1 tracking-widest">Email</p>
                                <input type="email" placeholder="athlete@fighterlist.com" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-gray-50 p-4 rounded-xl font-bold outline-none border-2 border-transparent focus:border-black transition-all" required />
                            </div>
                            <div>
                                <p className="text-[8px] font-black text-gray-400 uppercase mb-1.5 ml-1 tracking-widest">Password</p>
                                <input type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-gray-50 p-4 rounded-xl font-bold outline-none border-2 border-transparent focus:border-black transition-all" required />
                            </div>
                            {!isLogin && (
                                <div>
                                    <p className="text-[8px] font-black text-gray-400 uppercase mb-1.5 ml-1 tracking-widest">Confirm Password</p>
                                    <input type="password" placeholder="••••••••" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full bg-gray-50 p-4 rounded-xl font-bold outline-none border-2 border-transparent focus:border-black transition-all" required />
                                </div>
                            )}
                            {authError && <p className="text-[10px] font-black uppercase text-red-500 tracking-tight">{authError}</p>}
                            <button type="submit" className="w-full bg-black text-[#d7df22] py-5 rounded-xl font-black uppercase italic tracking-widest shadow-xl active:scale-95 transition-all hover:bg-[#d7df22] hover:text-black">
                                {isLogin ? 'Enter →' : 'Create Profile →'}
                            </button>
                            <p className="text-center text-[9px] font-black uppercase text-gray-400 cursor-pointer pt-1 hover:text-black transition-colors" onClick={() => { setIsLogin(!isLogin); setAuthError(""); }}>
                                {isLogin ? "No account? Sign up free →" : "Already a member? Login →"}
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
